<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Portfólio profissional de Gustavo Henrique, desenvolvedor Front-end e Full Stack em formação.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="icon" type="image/png"
            href="./fav.icons/TVN_Graffiti_re.png">
        <!-- Fontes consolidadas: Montserrat e Poppins (removida a redundância) -->
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="https://kit.fontawesome.com/aa1c17a9f7.js"
            crossorigin="anonymous"></script>
        <title>Quadro dos sonhos</title>
    </head>
    <body>
        <header>
            <h1>Quadro dos sonhos</h1>
            <p>Visualize, acredite e conquiste.</p>
        </header>
        <section>

            <form id="dreamform" class="form-container">
                <input type="url" placeholder="Url da imagem" id="imageUrl"
                    required>
                <input type="text" id="dreamtitle" placeholder="Seu sonho"
                    required>
                <button type="submit" id class="btn">Adicionar</button>

            </form>
        </section>
        <main>
            <div>
                <p id="empty-stage" class="vacum hidden">Nenhum sonho adicionado
                    ainda. Comece adicionando seus sonhos!</p>
            </div>

            <div id="dreams-grid" class="dreams-container">
                <!-- Os sonhos adicionados aparecerão aqui -->
            </div>
            <div>
            <button id="logout-btn" class="btn logout-btn">Sair da Conta</button>
            </div>
        </main>
        
       
       


        <footer>
            <p>© 2025 Gustavo Henrique. Todos os direitos reservados.</p>
        </footer>

        <script>
        // Proteção de acesso: Verificar se o usuário está logado
        document.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const currentUser = localStorage.getItem('currentUser');

            if (isLoggedIn !== 'true') {
                // Se não estiver logado, redireciona para a página de login
                alert('Acesso negado! Por favor, faça login.');
                window.location.href = 'index.html';
            } else {
                // Exibe o nome do usuário logado
                document.getElementById('user-display').textContent = currentUser;
            }
        });

        // Função de Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            // Remove o estado de login
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('currentUser');
            
            // Redireciona para a página de login
            window.location.href = 'login.html';
        });
    </script>

        <script src="script.js"></script>

    </body>

</html>
