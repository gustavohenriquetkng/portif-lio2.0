<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/aa1c17a9f7.js" crossorigin="anonymous"></script>
    <title>Refri-Gerante</title>
</head>
<body>
    <main>
        
        <div class="item active" style="--background:#EA3d41;">
            <div class="title">STRAWBERRY</div>
            <a href="./stor.html">
                <img src="./img/Morango-refrigerante-foregroundBlur.png" alt="Three floating strawberries with a soft blurred glow against a red background" class="fruit">
            
            <img src="./img/Morango-refrigerante.png" alt="Strawberry soda bottle with sliced strawberry details on a red background" class="refri">
        </div>
        </a>
        
        
        <div class="item" style="--background:#2D5643;">
            <div class="title">AVOCADO</div>
            <a href="./stor.html">
                <img src="./img/Abacate-refrigerante-foregroundBlur.png" alt="A blurred avocado floating in front of a deep green background" class="fruit">
            
                <img src="./img/Abacate-refrigerante.png" alt="Avocado soda bottle with avocado slices on a dark green background" class="refri">
        </div>
        </a>
        
        <div class="item" style="--background:#E7A043;">
            <div class="title">ORANGE</div>
            <a href="./stor.html">
                <img src="./img/Laranja-refrigerante-foregroundBlur.png" alt="A blurred orange floating in front of a warm yellow background" class="fruit">
            
            <img src="./img/Laranja-refrigerante.png" alt="Orange soda bottle with sliced orange pieces on a yellow background" class="refri">
        </div>
        </a>    
        
        <div class="arrow">
            <button id="prev"> < </button>
            <button id="next"> > </button>
        </div>

<script src="script.js"></script>
