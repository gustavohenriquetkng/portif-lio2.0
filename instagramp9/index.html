<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Portfólio profissional de Gustavo Henrique, desenvolvedor Front-end e Full Stack em formação.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="icon" type="image/png"
            href="./fav.icons/TVN_Graffiti_re.png">
        <!-- Fontes consolidadas: Montserrat e Poppins (removida a redundância) -->
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="https://kit.fontawesome.com/aa1c17a9f7.js"
            crossorigin="anonymous"></script>
        <title>Instagram</title>
    </head>
    <body>
        <div class="container-img">
            <img src="./img/ChatGPT Image 13 de jan. de 2026, 10_08_54.png"
                alt="Imagem de um celular antigo" class="img-celular">
        </div>

        <div class="container-form">
            <img src="./img/instagram_logo_no_bg.png" class="insta-lg">
            <form class="form-login">
                <input type="text" required
                    placeholder="Telefone, nome de usuário ou email">
                <input type="password" placeholder="Senha" required>
                <button>Entrar</button>
            </form>

            <div class="ou">
                <hr>
                <span>OU</span>
                <hr>
            </div>
            <a href="#" class="login-facebook">
                <i class="fa-brands fa-square-facebook"></i>
                Entrar com o Facebook
            </a>
            <a href="#" class="esqueceu-senha">Esqueceu a senha?</a>
            <p class="cadastro">Não tem uma conta? <a href="#"
                    class="ui">Cadastre-se</a></p>
        </div>

        
        <footer class="insta-footer">
            <ul class="insta-links">
                <li><a href="#">Meta</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Carreiras</a></li>
                <li><a href="#">Ajuda</a></li>
                <li><a href="#">API</a></li>
                <li><a href="#">Privacidade</a></li>
                <li><a href="#">Termos</a></li>
                <li><a href="#">Localizações</a></li>
                <li><a href="#">Instagram Lite</a></li>
                <li><a href="#">Threads</a></li>
                <li><a href="#">Upload de contatos</a></li>
                <li><a href="#">Meta Verified</a></li>
            </ul>

            <div class="insta-copy">
                <select aria-label="Selecionar idioma">
                    <option>Português (Brasil)</option>
                    <option>English</option>
                    <option>Español</option>
                </select>

                <span>© 2026 Instagram from Meta</span>
            </div>
        </footer>

    </body>
</html>
